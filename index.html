<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 YouTube Thumbnail Preview</h1>
            <p class="subtitle">Vista previa de thumbnails en diferentes tamaños</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="youtube-url">URL del video de YouTube:</label>
                <input 
                    type="text" 
                    id="youtube-url" 
                    placeholder="https://www.youtube.com/watch?v=..." 
                    autocomplete="off"
                >
                <button id="load-btn" class="btn-primary">Cargar Video</button>
            </div>
            
            <div class="divider">
                <span>O</span>
            </div>
            
            <div class="input-group">
                <label for="local-image">Cargar imagen local:</label>
                <input 
                    type="file" 
                    id="local-image" 
                    accept="image/*"
                >
                <button id="load-local-btn" class="btn-secondary">Usar Imagen Local</button>
            </div>
            
            <div class="input-group" id="title-group">
                <label for="video-title">Título del video:</label>
                <input 
                    type="text" 
                    id="video-title" 
                    placeholder="Ingresa el título del video..." 
                    autocomplete="off"
                >
            </div>
        </div>

        <div class="size-selector">
            <h2>Selecciona el tamaño de pantalla:</h2>
            <div class="size-buttons">
                <button class="size-btn active" data-size="mobile">
                    📱 Celular
                </button>
                <button class="size-btn" data-size="desktop">
                    💻 PC
                </button>
                <button class="size-btn" data-size="tv">
                    📺 TV
                </button>
            </div>
        </div>

        <div class="preview-section" id="preview-section" style="display: none;">
            <div class="preview-container" id="preview-container">
                <div class="preview-device" id="preview-device">
                    <div class="thumbnail-wrapper">
                        <img id="thumbnail-img" src="" alt="YouTube Thumbnail">
                        
                    </div>
                    <div class="title-wrapper">
                        <h3 id="preview-title">Título del video</h3>
                    </div>
                </div>
            </div>
            
            <div class="info-panel">
                <div class="info-item">
                    <strong>Resolución:</strong>
                    <span id="resolution-info">-</span>
                </div>
                <div class="info-item">
                    <strong>Tamaño de fuente:</strong>
                    <span id="font-size-info">-</span>
                </div>
            </div>
        </div>

        <div class="error-message" id="error-message" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
